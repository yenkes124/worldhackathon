# Fly.io config: `fly deploy` builds the Dockerfile; set the key once with
#   fly secrets set REACTOR_API_KEY=rk_...
app = "neurogrid-brain"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
