app = "neurogrid-reactor"
primary_region = "lhr"

[build]
  dockerfile = "reactor/fly/Dockerfile"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  PYTHONUNBUFFERED = "1"
  WEBRTC_PORT_RANGE = "50000:50019"
  ICE_TRANSPORT_POLICY = "all"
  STUN_SERVERS = "stun:stun.l.google.com:19302"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[services]]
  internal_port = 50000
  protocol = "udp"

  [[services.ports]]
    start_port = 50000
    end_port = 50019
